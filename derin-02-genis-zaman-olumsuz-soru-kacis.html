<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geniş Zaman Kaçış</title>
<meta name="description" content="Geniş zaman olumsuz ve soru — escape room, eki harf harf yaz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --night:#0f1a2e; --stone:#1a2740; --stone-lt:#26375a;
    --gold:#f4c430; --gold-dim:#c99a1f; --ink:#eaf1ff; --ink-soft:#a9bbdc;
    --good:#3ecf8e; --bad:#e2536b; --teal:#49c6e5; --rose:#e268a6;
    --line:#304a73; --shadow:0 20px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:
      radial-gradient(1200px 600px at 50% -10%, #1c3358 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #152642 0%, transparent 55%),
      var(--night);
    color:var(--ink); font-family:"Fredoka",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
  .wrap{max-width:680px; margin:0 auto; padding:22px 16px 34px; min-height:100%; display:flex; flex-direction:column;}
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px;}
  .brand{font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:var(--gold); font-weight:600;}
  .meta{display:flex; gap:14px; align-items:center; font-size:14px; color:var(--ink-soft);}
  .meta b{color:var(--ink); font-variant-numeric:tabular-nums;}
  .locks{display:flex; gap:5px; font-size:17px; margin-bottom:12px; justify-content:center; flex-wrap:wrap;}
  .locks span{filter:grayscale(1) opacity(.35); transition:.4s;}
  .locks span.open{filter:none; transform:scale(1.14);}

  .stage{background:linear-gradient(180deg, rgba(255,255,255,.04), transparent 40%), var(--stone);
    border:1px solid var(--line); border-radius:24px; box-shadow:var(--shadow);
    padding:24px 20px 28px; position:relative; overflow:hidden; flex:1;}
  .stage::before{content:""; position:absolute; inset:0; border-radius:24px; pointer-events:none; box-shadow:inset 0 0 90px rgba(0,0,0,.4);}
  .torch{position:absolute; top:14px; font-size:22px; opacity:.9; animation:flick 1.6s infinite alternate; z-index:0;}
  .torch.l{left:14px} .torch.r{right:14px}
  @keyframes flick{from{opacity:.6; transform:translateY(0)} to{opacity:1; transform:translateY(-2px)}}
  #screen{position:relative; z-index:1;}

  h1{font-family:"Cinzel",serif; font-weight:900; text-align:center; text-wrap:balance;
    font-size:clamp(24px,6.2vw,36px); margin:.1em 0; color:var(--gold);
    text-shadow:0 2px 0 #000, 0 0 26px rgba(244,196,48,.28);}
  .cat{text-align:center; font-size:clamp(42px,12vw,66px); line-height:1; margin:4px 0;}
  .lead{text-align:center; font-size:clamp(15px,3.6vw,18px); color:var(--ink); line-height:1.55; max-width:44ch; margin:6px auto;}
  .lead .tr{display:block; color:var(--ink-soft); font-size:.84em; margin-top:4px;}
  .step-label{text-align:center; font-family:"Cinzel",serif; letter-spacing:.08em; text-transform:uppercase; font-size:12px; color:var(--gold-dim); margin-bottom:4px;}
  .part-badge{display:inline-block; background:rgba(73,198,229,.16); border:1px solid var(--teal); color:var(--teal);
    font-weight:700; font-size:12.5px; padding:3px 12px; border-radius:20px;}
  .part-wrap{text-align:center; margin-bottom:8px;}
  .en-card{background:#14223c; border:1px solid var(--line); border-left:4px solid var(--rose);
    border-radius:14px; padding:14px 15px; margin:10px auto 2px; max-width:520px; text-align:center;}
  .en-card .en{font-size:clamp(16px,4.2vw,20px); color:var(--ink); font-weight:600;}
  .en-card .tag{display:block; font-size:12.5px; color:var(--rose); margin-top:4px; text-transform:uppercase; letter-spacing:.05em;}
  .tr-line{text-align:center; font-size:clamp(17px,4.4vw,21px); margin:16px auto 2px; line-height:1.7;}
  .tr-line .before{color:var(--ink);}
  .tr-line .stem{color:var(--gold); font-weight:700;}

  .boxes{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:14px auto 4px; max-width:560px; align-items:flex-end;}
  .stemtag{font-family:"Cinzel",serif; font-weight:700; font-size:24px; color:var(--gold); padding-bottom:8px; white-space:nowrap;}
  .lb{width:38px; height:48px; border:2px solid var(--line); border-radius:10px; background:#0f1a2e; color:var(--ink);
    font-family:"Cinzel",serif; font-weight:700; font-size:24px; text-align:center; caret-color:var(--gold); transition:.12s; padding:0;}
  .lb:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(244,196,48,.18);}
  .lb.good{border-color:var(--good); background:rgba(62,207,142,.15); color:var(--good);}
  .lb.wrong{border-color:var(--bad); background:rgba(226,83,107,.15); color:var(--bad);}
  /* makas ayırıcı — kutular arası tıklanabilir bölme noktası */
  .cut{width:20px; height:48px; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; border-radius:6px; transition:.12s;}
  .cut::before{content:""; width:2px; height:30px; background:var(--line); border-radius:2px; transition:.12s;}
  .cut.arm{cursor:pointer;}
  .cut.arm::before{background:var(--teal); box-shadow:0 0 6px rgba(73,198,229,.6);}
  .cut.arm:hover{background:rgba(73,198,229,.12);} .cut.arm:hover::before{height:40px;}
  .cut.scissors::after{content:"✂️"; position:absolute; top:-18px; font-size:13px; opacity:.85;}
  .cut.opened{width:16px;}
  .cut.opened::before{width:0;}
  .cut.wronghere{background:rgba(226,83,107,.18); border-radius:6px;}
  .cut.wronghere::before{background:var(--bad);}
  .gapshown{width:14px; height:48px;}
  .tool-row{text-align:center; margin-top:12px;}
  .tool-note{display:inline-flex; align-items:center; gap:7px; background:rgba(73,198,229,.1); border:1px solid var(--teal); color:var(--teal);
    font-size:13.5px; font-weight:600; padding:7px 14px; border-radius:30px;}

  .feedback{text-align:center; min-height:22px; margin-top:12px; font-size:15px; font-weight:500;}
  .feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
  .feedback .sol{color:var(--gold);}
  .hintline{text-align:center; font-size:13px; color:var(--ink-soft); margin-top:8px;}
  .hintline b{color:var(--gold);}

  .btn{display:block; margin:16px auto 0; appearance:none; border:none; cursor:pointer; font-family:"Cinzel",serif; font-weight:700; letter-spacing:.04em;
    font-size:16px; padding:13px 30px; border-radius:40px; color:#1a1300; background:linear-gradient(180deg,#ffdc5e,var(--gold-dim));
    box-shadow:0 8px 22px rgba(244,196,48,.3); transition:.15s;}
  .btn:hover{transform:translateY(-2px)} .btn:disabled{opacity:.4; cursor:default; transform:none;}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink-soft); box-shadow:none; font-size:14px; padding:9px 22px;}
  .field{display:block; width:100%; max-width:340px; margin:14px auto 0; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:#0f1a2e; color:var(--ink); font-family:inherit; font-size:17px; text-align:center;}
  .field:focus{outline:none; border-color:var(--gold-dim);}
  .mini{text-align:center; font-size:12.5px; color:var(--gold-dim); margin-top:8px;}
  .shake{animation:shake .4s;} @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .pop{animation:pop .4s;} @keyframes pop{0%{transform:scale(.95)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  .result-stats{display:flex; gap:22px; justify-content:center; margin:14px 0 4px;}
  .result-stats .n{font-family:"Cinzel",serif; font-size:30px; color:var(--gold); font-variant-numeric:tabular-nums;}
  .result-stats .k{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em;}
</style>

<!-- ═══ Özel Orhan Veli Türkçe Okulu — Sonuç Sistemi (her oyunda aynı) ═══ -->
<style>
.ovt-box{margin:16px 0 8px;text-align:center;font-family:inherit}
.ovt-btn{display:block;width:100%;font:inherit;font-weight:800;font-size:18px;padding:14px 20px;border:none;border-radius:12px;cursor:pointer;background:#f59e0b;color:#111;box-shadow:0 6px 18px rgba(245,158,11,.35);transition:transform .1s}
.ovt-btn:active{transform:scale(.98)}
.ovt-btn:disabled{opacity:.6;cursor:default}
.ovt-msg{margin-top:10px;font-size:15px;font-weight:700;line-height:1.4}
.ovt-ok{color:#22c55e}.ovt-err{color:#ef4444}
.ovt-msg a{color:inherit}
</style>
<script>
var OVT=(function(){
  var API="https://script.google.com/macros/s/AKfycbxrFZwaMLclRt08PJ_s1FiqcTHOlHuWW8y-XOBXrXy5brsIyt_rVjHMBe4h5LGjj2j0sA/exec";
  var VITRIN="https://orhanveliturkish.co.uk/oyunlar.html";
  var q=new URLSearchParams(location.search);
  var ad=(q.get("ad")||"").trim(), email=(q.get("email")||"").trim().toLowerCase();
  function el(id){return typeof id==="string"?document.getElementById(id):id;}
  function renderSend(box,data){
    box=el(box); if(!box) return;
    box.className="ovt-box";
    if(!email){
      box.innerHTML='<div class="ovt-msg ovt-err">Sonucunun öğretmenine ulaşması için oyunu <a href="'+VITRIN+'" target="_blank" rel="noopener">okulumuzun Oyunlar sayfasından</a> açmalısın.</div>';
      return;
    }
    box.innerHTML='<button type="button" class="ovt-btn">📨 Sonucu Gönder</button><div class="ovt-msg"></div>';
    var b=box.querySelector("button"), m=box.querySelector(".ovt-msg");
    b.onclick=function(){
      b.disabled=true; b.textContent="Gönderiliyor…"; m.textContent=""; m.className="ovt-msg";
      fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({action:"save",email:email,oyun:data.oyun,sure:String(data.sure),puan:String(data.puan)})})
      .then(function(r){return r.json();})
      .then(function(r){
        if(r.ok){ b.textContent="✅ Gönderildi"; m.textContent="Sonucun öğretmenine ulaştı. Aferin!"; m.className="ovt-msg ovt-ok"; }
        else { b.disabled=false; b.textContent="📨 Tekrar dene"; m.textContent=r.msg||"Gönderilemedi."; m.className="ovt-msg ovt-err"; }
      })
      .catch(function(){ b.disabled=false; b.textContent="📨 Tekrar dene"; m.textContent="Bağlantı kurulamadı. İnternetini kontrol edip tekrar dene."; m.className="ovt-msg ovt-err"; });
    };
  }
  function fill(id){ var i=el(id); if(i&&ad&&!i.value) i.value=ad; }
  return {ad:ad,email:email,renderSend:renderSend,fill:fill};
})();
</script>
<!-- ═══ Sonuç Sistemi sonu ═══ -->
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Orhan Veli · Geniş Zaman Kaçış</div>
    <div class="meta"><span>⏱ <b id="timer">0:00</b></span><span>❌ <b id="errs">0</b></span></div>
  </div>
  <div class="locks" id="locks"></div>
  <div class="stage">
    <div class="torch l">🔥</div><div class="torch r">🔥</div>
    <div id="screen"></div>
  </div>
</div>

<script>
var timerEl=document.getElementById('timer'), errsEl=document.getElementById('errs'), locksEl=document.getElementById('locks');
var errors=0, startTime=null, timerInt=null, elapsed=0, penalty=0, current=0, playerName="";

function fmt(s){var m=Math.floor(s/60);var r=s%60;return m+":"+(r<10?"0":"")+r;}
function tick(){ elapsed=Math.floor((Date.now()-startTime)/1000)+penalty; timerEl.textContent=fmt(elapsed); }
function startTimer(){ startTime=Date.now(); timerInt=setInterval(tick,1000); tick(); }
function stopTimer(){ clearInterval(timerInt); }
function addErr(sec){ errors++; errsEl.textContent=errors; penalty+=(sec||8); tick(); }

// Türkçe harf esnekliği (klavyede ı/ö/ü/ç/ğ/ş yoksa i/o/u/c/g/s de kabul)
var FOLD={"ı":"i","İ":"i","i":"i","ö":"o","Ö":"o","o":"o","ü":"u","Ü":"u","u":"u","ç":"c","Ç":"c","c":"c","ğ":"g","Ğ":"g","g":"g","ş":"s","Ş":"s","s":"s"};
function norm(ch){ ch=(ch||"").trim(); if(ch==="") return ""; var low=ch.toLocaleLowerCase("tr-TR"); return FOLD[low]||FOLD[ch]||low; }

// 12 KAPI — before=cümle başı, stem=kök(altın), letters=harfler(boşluksuz), after, en, tip.
// Soru kapılarında split=doğru boşluk indeksi (kaçıncı harften SONRA boşluk) — öğrenci makasla açar.
// Olumsuz kapılarda split=0 (makas yok, ek bitişik).
var DOORS=[
  // ---- BÖLÜM 1: OLUMSUZ (makas yok) ----
  { part:"1. Bölüm — Olumsuz (–)", before:"Ben her gün okula ", stem:"git", letters:"mem", split:0, after:".", en:"I do not go to school every day.", tip:"Olumsuz" },
  { part:"1. Bölüm — Olumsuz (–)", before:"Ben çay ", stem:"iç", letters:"mem", split:0, after:".", en:"I do not drink tea.", tip:"Olumsuz" },
  { part:"1. Bölüm — Olumsuz (–)", before:"O hızlı ", stem:"koş", letters:"maz", split:0, after:".", en:"She does not run fast.", tip:"Olumsuz" },
  { part:"1. Bölüm — Olumsuz (–)", before:"Biz kitap ", stem:"oku", letters:"mayız", split:0, after:".", en:"We do not read books.", tip:"Olumsuz" },
  // ---- BÖLÜM 2: SORU (makas: "er|misin" -> split 2) ----
  { part:"2. Bölüm — Soru (?)", before:"Sen okula ", stem:"gid", letters:"ermisin", split:2, after:"?", en:"Do you go to school?", tip:"Soru" },
  { part:"2. Bölüm — Soru (?)", before:"Sen süt ", stem:"iç", letters:"ermisin", split:2, after:"?", en:"Do you drink milk?", tip:"Soru" },
  { part:"2. Bölüm — Soru (?)", before:"O futbol ", stem:"oyna", letters:"rmı", split:1, after:"?", en:"Does he play football?", tip:"Soru" },
  { part:"2. Bölüm — Soru (?)", before:"Sen kitap ", stem:"oku", letters:"rmusun", split:1, after:"?", en:"Do you read books?", tip:"Soru" },
  // ---- BÖLÜM 3: KARIŞIK ----
  { part:"3. Bölüm — Karışık (±?)", before:"Ben erken ", stem:"uyu", letters:"mam", split:0, after:".", en:"I do not sleep early.", tip:"Olumsuz" },
  { part:"3. Bölüm — Karışık (±?)", before:"Sen ", stem:"yaz", letters:"armısın", split:2, after:"?", en:"Do you write?", tip:"Soru" },
  { part:"3. Bölüm — Karışık (±?)", before:"O ", stem:"gül", letters:"mez", split:0, after:".", en:"He does not laugh.", tip:"Olumsuz" },
  { part:"3. Bölüm — Karışık (±?)", before:"Biz ", stem:"gid", letters:"ermiyiz", split:2, after:"?", en:"Do we go?", tip:"Soru" },
];

function renderLocks(){
  locksEl.innerHTML="";
  for(var i=0;i<DOORS.length;i++){
    var s=document.createElement('span'); s.textContent=i<current?"🔓":"🔒"; if(i<current)s.className="open"; locksEl.appendChild(s);
  }
}

function renderIntro(){
  document.getElementById('screen').innerHTML=
    '<div class="cat">🗝️📜</div>'+
    '<h1>Geniş Zaman Kaçış</h1>'+
    '<p class="lead">12 kapılı eski bir kütüphanedesin! Her kapıda bir İngilizce cümle var. '+
    'Türkçesini yazmak için fiilin <b>kökü hazır</b> (altın). Sen sadece <b>olumsuz ya da soru ekini</b> harf harf yaz, kapı açılsın! '+
    '<span class="tr">Write the negative or question ending to open each door.</span></p>'+
    '<input class="field" id="who" placeholder="Adını yaz / Your name" autocomplete="name">'+
    '<button class="btn" id="go">Kaçışı başlat ▶</button>'+
    '<div class="mini">1. bölüm olumsuz · 2. bölüm soru · 3. bölüm karışık. 🔐</div>';
  OVT.fill("who");
  var inp=document.getElementById('who');
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('go').click(); });
  document.getElementById('go').onclick=function(){
    playerName=(inp.value||"").trim();
    if(!playerName){ inp.focus(); inp.style.borderColor="var(--bad)"; return; }
    current=0; errors=0; errsEl.textContent=0; penalty=0; elapsed=0; timerEl.textContent="0:00";
    startTimer(); renderDoor();
  };
  renderLocks();
}

var cutPos=-1; // öğrencinin koyduğu boşluğun yeri (kaçıncı harften sonra); -1 = yok
function renderDoor(){
  renderLocks();
  var d=DOORS[current];
  cutPos=-1;
  var isSoru=d.split>0;
  var n=d.letters.length;
  // kutular + aralarına tıklanabilir ayırıcı (cut). cut data-pos = kaçıncı harften sonra
  var boxes='<span class="stemtag">'+d.stem+' +</span>';
  for(var i=0;i<n;i++){
    boxes+='<input class="lb" data-i="'+i+'" maxlength="1" autocomplete="off" autocapitalize="off" inputmode="text">';
    if(i<n-1) boxes+='<span class="cut" data-pos="'+(i+1)+'"></span>';
  }
  var solText=d.stem+d.letters.slice(0,d.split)+(isSoru?" ":"")+d.letters.slice(d.split);
  document.getElementById('screen').innerHTML=
    '<div class="step-label">'+(current+1)+'. Kapı / Door '+(current+1)+' / 12</div>'+
    '<div class="part-wrap"><span class="part-badge">'+d.part+'</span></div>'+
    '<div class="en-card"><div class="en">🔎 '+d.en+'</div><span class="tag">'+d.tip+' cümle — Türkçesini tamamla</span></div>'+
    '<div class="tr-line"><span class="before">'+d.before+'</span><span class="stem">'+d.stem+'</span>___<span class="before">'+d.after+'</span></div>'+
    '<div class="boxes" id="boxes">'+boxes+'</div>'+
    (isSoru? '<div class="tool-row"><span class="tool-note">✂️ Harfleri yaz, sonra soru ekinden ÖNCE boşluk koy! / Cut before the question word.</span></div>' : '')+
    '<button class="btn" id="check">Kapıyı aç 🔓</button>'+
    '<div class="hintline">İpucu: Kök <b>'+d.stem+'</b>, sen '+(isSoru?"soru ekini yaz, sonra ✂️ ile <b>mı/mi/mu</b>'den önce boşluk aç":"olumsuz eki (-m… / -maz/-mez) yaz")+'.</div>'+
    '<div class="feedback" id="fb"></div>';
  var inputs=Array.prototype.slice.call(document.querySelectorAll('.lb'));
  inputs.forEach(function(inp,k){
    inp.addEventListener('input',function(){
      inp.classList.remove('wrong');
      if(inp.value && k<inputs.length-1){ inputs[k+1].focus(); }
      if(isSoru) refreshCuts();
    });
    inp.addEventListener('keydown',function(e){
      if(e.key==='Backspace' && !inp.value && k>0){ inputs[k-1].focus(); }
      if(e.key==='Enter'){ document.getElementById('check').click(); }
    });
  });
  if(inputs[0]) inputs[0].focus();

  function allFilled(){ return inputs.every(function(inp){return inp.value.trim().length>0;}); }
  // makas: harfler dolunca ayırıcılar aktifleşir
  function refreshCuts(){
    var ready=allFilled();
    document.querySelectorAll('.cut').forEach(function(c){
      c.classList.toggle('arm', ready && cutPos===-1);
      c.classList.toggle('scissors', ready && cutPos===-1);
    });
  }
  if(isSoru){
    document.getElementById('boxes').addEventListener('click',function(e){
      var c=e.target.closest('.cut'); if(!c) return;
      if(!allFilled()){ bad("Önce bütün harfleri yaz, sonra boşluk koy ✂️"); shake(); return; }
      if(cutPos!==-1) return; // bir kez
      cutPos=+c.dataset.pos;
      // boşluğu göster
      document.querySelectorAll('.cut').forEach(function(x){ x.classList.remove('arm','scissors'); });
      c.classList.add('opened'); c.classList.add('gapshown');
    });
    refreshCuts();
  }

  document.getElementById('check').onclick=function(){
    if(!allFilled()){ bad("Bütün kutuları doldur 🙂"); shake(); return; }
    // harf kontrolü
    var lettersOk=true;
    inputs.forEach(function(inp){
      var i=+inp.dataset.i;
      if(norm(inp.value)===norm(d.letters[i])){ inp.classList.add('good'); inp.classList.remove('wrong'); }
      else { inp.classList.add('wrong'); inp.classList.remove('good'); lettersOk=false; }
    });
    if(!lettersOk){ addErr(8); bad('Kırmızı harfleri düzelt. Doğrusu: <span class="sol">'+solText+'</span>'); shake(); return; }
    // soru ise boşluk kontrolü
    if(isSoru){
      if(cutPos===-1){ bad('✂️ Soru ekinden önce boşluk koymayı unutma! (… <b>mı/mi/mu</b>)'); shake();
        document.querySelectorAll('.cut').forEach(function(c){ c.classList.add('arm','scissors'); }); return; }
      if(cutPos!==d.split){
        addErr(8);
        // yanlış yeri işaretle
        var wrongCut=document.querySelector('.cut[data-pos="'+cutPos+'"]');
        if(wrongCut) wrongCut.classList.add('wronghere');
        bad('Boşluk yanlış yerde. Soru eki <b>'+d.letters.slice(d.split)+'</b> ayrı yazılır. Doğrusu: <span class="sol">'+solText+'</span>');
        shake();
        // sıfırla ki tekrar deneyebilsin
        setTimeout(function(){ if(wrongCut){wrongCut.classList.remove('wronghere','opened','gapshown');} cutPos=-1;
          document.querySelectorAll('.cut').forEach(function(c){ c.classList.add('arm','scissors'); }); }, 900);
        return;
      }
    }
    // hepsi doğru
    good("Doğru! "+solText.replace(d.stem,"").trim()+" → kapı açıldı 🔓"); pop();
    document.getElementById('check').disabled=true;
    inputs.forEach(function(x){x.disabled=true;});
    setTimeout(advance,1150);
  };
}
function good(m){var fb=document.getElementById('fb'); if(fb){fb.className="feedback good"; fb.innerHTML=m;}}
function bad(m){var fb=document.getElementById('fb'); if(fb){fb.className="feedback bad"; fb.innerHTML=m;}}
function pop(){var s=document.getElementById('screen'); s.classList.add('pop'); setTimeout(function(){s.classList.remove('pop');},400);}
function shake(){var s=document.getElementById('screen'); s.classList.add('shake'); setTimeout(function(){s.classList.remove('shake');},400);}
function advance(){ current++; if(current>=DOORS.length) renderWin(); else renderDoor(); }

function renderWin(){
  stopTimer(); renderLocks();
  document.getElementById('screen').innerHTML=
    '<div class="cat pop">🏆🗝️</div><h1>Kaçtın, '+playerName.replace(/</g,'&lt;')+'!</h1>'+
    '<p class="lead">12 kapının hepsini açtın! Geniş zaman olumsuz ve soru eklerini çok iyi yazıyorsun. 👏 '+
    '<span class="tr">You opened all 12 doors!</span></p>'+
    '<div class="result-stats">'+
      '<div><div class="n">'+fmt(elapsed)+'</div><div class="k">Süre</div></div>'+
      '<div><div class="n">'+errors+'</div><div class="k">Hata</div></div>'+
    '</div>'+
    '<div id="ovtSend"></div>'+
    '<button class="btn ghost" id="again">↺ Baştan oyna</button>';
  OVT.renderSend("ovtSend", { oyun:"Geniş Zaman Kaçış — Olumsuz & Soru (Derin)", sure:fmt(elapsed), puan:errors+" hata" });
  document.getElementById('again').onclick=function(){ renderIntro(); };
}

renderIntro();
</script>
